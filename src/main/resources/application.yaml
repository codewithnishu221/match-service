spring:
  application:
    name: MATCH-SERVICE
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
      embedding:
        model: nomic-embed-text
server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  generation:
    temperature: 0.3

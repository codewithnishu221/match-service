spring:
  application:
    name: match-service
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
      embedding:
        model: nomic-embed-text
server:
  port: 8083

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  generation:
    temperature: 0.3

  services:
    resume-service-url: http://localhost:8081
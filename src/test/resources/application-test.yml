server:
  port: 8083

spring:
  application:
    name: MATCH-SERVICE
  cloud:
    discovery:
      enabled: false
  ai:
    ollama:
      base-url: http://localhost:11434

app:
  generation:
    temperature: 0.3
  jwt:
    secret: ${JWT_SECRET:test-secret-key-that-is-at-least-256-bits-long-for-testing-purposes}
    expiration: 86400000

eureka:
  client:
    enabled: false